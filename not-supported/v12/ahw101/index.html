<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        :root {
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.5);
            --glass: rgba(15, 23, 42, 0.7);
        }
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #020617;
            font-family: 'Outfit', system-ui, sans-serif;
            overflow: hidden;
            color: #f8fafc;
        }
        /* 2026 Kinetic Background */
        .bg-mesh {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 30%, #1e1b4b 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, #4c1d95 0%, transparent 40%);
            filter: blur(80px);
            z-index: -1;
            animation: pulse 15s infinite alternate;
        }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

        .bento-container {
            background: var(--glass);
            backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem;
            border-radius: 40px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        .status-badge {
            display: inline-block;
            background: rgba(139, 92, 246, 0.1);
            color: var(--accent);
            padding: 6px 16px;
            border-radius: 99px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--accent);
        }
        h1 {
            font-size: 2.5rem;
            margin: 0 0 1rem;
            background: linear-gradient(to bottom right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; }    
        h2 {
            font-size: 1.5rem;
            margin: 0 0 1rem;
            background: linear-gradient(to bottom right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p { color: #94a3b8; line-height: 1.7; font-size: 1.1rem; margin-bottom: 2.5rem; }
        .cta-btn {
            background: #fff;
            color: #020617;
            padding: 18px 40px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .cta-btn:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 0 30px var(--accent-glow);
            background: var(--accent);
            color: white;
        }
    </style>
</head>
<body>
    <div class="bg-mesh"></div>
    <div class="bento-container">
        <div class="status-badge">disclamer</div>
        <h1>New Experience Ready.</h1>
        <h2>DISCLAMER</h2>
        <p>This portal has sunset. We've deployed a faster, unblockable architecture at our new destination. The new version is not going to be blocked so easily and has more links. Still by ahw101!</p>
        <a href="https://ahw101.github.io" class="cta-btn">
            Launch New Site <span>→</span>
        </a>
    </div>
</body>
</html>
